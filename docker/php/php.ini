; docker/php/php.ini — Configuration PHP pour CAMWATER PRO

[PHP]
memory_limit        = 256M
max_execution_time  = 60
upload_max_filesize = 20M
post_max_size       = 20M
display_errors      = Off
log_errors          = On
error_log           = /var/log/php-fpm/error.log

[Date]
date.timezone = Africa/Douala