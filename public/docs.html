
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAMWATER PRO — Documentation API</title>
    <link rel="stylesheet" 
          href="http://127.0.0.1:8000/swagger-ui.css">
    <style>
        body { margin: 0; padding: 0; }
        .swagger-ui .topbar { background-color: #1a5276; }
    </style>
</head>
<body>
    <div id="swagger-ui"></div>

    <script src="http://127.0.0.1:8000/swagger-ui-bundle.js"></script>
    <script src="http://127.0.0.1:8000/swagger-ui-standalone-preset.js"></script>
    <script>
        window.onload = function () {
            SwaggerUIBundle({
                url: "http://127.0.0.1:8000/swagger.yaml",
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "StandaloneLayout",
                tryItOutEnabled: true,
                persistAuthorization: true,
            });
        };
    </script>
</body>
</html>
