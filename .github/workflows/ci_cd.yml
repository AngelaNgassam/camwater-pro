name: CI/CD - CAMWATER PRO

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:

  # ── 1. LINT ─────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: PHP CS Fixer
        run: |
          if [ -f vendor/bin/php-cs-fixer ]; then
            vendor/bin/php-cs-fixer fix --dry-run --diff
          fi

  # ── 2. TESTS ────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo,pdo_sqlite,pdo_mysql,mbstring,bcmath,zip
      - run: composer install --no-interaction --prefer-dist
      - name: Setup .env.testing
        run: |
          cp .env.example .env.testing
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env.testing
          echo "DB_DATABASE=:memory:" >> .env.testing
          php artisan key:generate --env=testing --force
          php artisan jwt:secret --env=testing --force
      - name: Run Tests
        run: php artisan test --env=testing --exclude-group=example

  # ── 3. SONARCLOUD ────────────────────────
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: test
    # Continue même si SONAR_TOKEN n'est pas configuré
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarCloud Scan
        # Ne tourne que si le secret est configuré
        if: ${{ secrets.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ── 4. DOCKER HUB ────────────────────────
  build:
    name: Docker Hub
    runs-on: ubuntu-latest
    needs: [test, sonar]
    # Continue même si DOCKERHUB secrets ne sont pas configurés
    continue-on-error: true
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@v4
      - name: Check Docker secrets
        id: check_docker
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "⚠️ DOCKERHUB secrets non configurés — étape ignorée"
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.check_docker.outputs.configured == 'true'
      - uses: docker/login-action@v3
        if: steps.check_docker.outputs.configured == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        if: steps.check_docker.outputs.configured == 'true'
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/camwater-pro:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/camwater-pro:latest

  # ── 5. DEPLOY O2SWITCH (OPTIONNEL) ──────
  deploy:
    name: Deploy o2switch
    runs-on: ubuntu-latest
    needs: [test, sonar, build]
    # ✅ NE BLOQUE PAS le pipeline si o2switch n'est pas configuré
    continue-on-error: true
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@v4

      # Vérification des secrets o2switch avant tout
      - name: Check o2switch secrets
        id: check_o2switch
        run: |
          if [ -z "${{ secrets.O2SWITCH_HOST }}" ] || \
             [ -z "${{ secrets.O2SWITCH_USER }}" ] || \
             [ -z "${{ secrets.O2SWITCH_PASSWORD }}" ] || \
             [ -z "${{ secrets.O2SWITCH_DB_HOST }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "⚠️ Secrets o2switch non configurés — deploy ignoré"
          else
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "✅ Secrets o2switch OK — deploy en cours"
          fi

      # PHP + Node
      - uses: shivammathur/setup-php@v2
        if: steps.check_o2switch.outputs.configured == 'true'
        with:
          php-version: "8.3"
          extensions: mbstring,pdo,pdo_mysql,bcmath,zip,gd,openssl
      - uses: actions/setup-node@v4
        if: steps.check_o2switch.outputs.configured == 'true'
        with:
          node-version: "20"
          cache: 'npm'

      # Build
      - name: Composer & Vite build
        if: steps.check_o2switch.outputs.configured == 'true'
        run: |
          composer install --no-dev --optimize-autoloader
          npm ci --production
          npm install vite --save-dev || true
          npx vite build

      # .env PROD
      - name: Generate .env
        if: steps.check_o2switch.outputs.configured == 'true'
        env:
          APP_URL: https://ngassam.cdwfs.net
          DB_HOST: ${{ secrets.O2SWITCH_DB_HOST }}
          DB_PORT: ${{ secrets.O2SWITCH_DB_PORT }}
          DB_DATABASE: ${{ secrets.O2SWITCH_DB_DATABASE }}
          DB_USERNAME: ${{ secrets.O2SWITCH_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.O2SWITCH_DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.O2SWITCH_JWT_SECRET }}
        run: |
          APP_KEY=$(php artisan key:generate --show)
          cat > .env << EOF
          APP_NAME="Camwater Pro"
          APP_ENV=production
          APP_DEBUG=false
          APP_URL=$APP_URL
          APP_KEY=$APP_KEY

          DB_CONNECTION=mysql
          DB_HOST=$DB_HOST
          DB_PORT=$DB_PORT
          DB_DATABASE=$DB_DATABASE
          DB_USERNAME=$DB_USERNAME
          DB_PASSWORD=$DB_PASSWORD

          SESSION_DRIVER=database
          CACHE_STORE=database
          QUEUE_CONNECTION=database
          JWT_SECRET=$JWT_SECRET
          VITE_APP_URL=$APP_URL
          EOF

      # Cache Laravel
      - name: Cache config
        if: steps.check_o2switch.outputs.configured == 'true'
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      # Préparation du paquet
      - name: Prepare FULL Laravel
        if: steps.check_o2switch.outputs.configured == 'true'
        run: |
          mkdir deploy
          rsync -av --delete \
            --exclude='storage/' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='.git/' \
            --exclude='.env.example' \
            --exclude='tests/' \
            --exclude='docker/' \
            ./ deploy/
          cp .env deploy/
          echo "📦 $(du -sh deploy/)"

      # FTP Deploy
      - name: Install lftp
        if: steps.check_o2switch.outputs.configured == 'true'
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy FTP
        if: steps.check_o2switch.outputs.configured == 'true'
        env:
          FTP_HOST: ${{ secrets.O2SWITCH_HOST }}
          FTP_USER: ${{ secrets.O2SWITCH_USER }}
          FTP_PASS: ${{ secrets.O2SWITCH_PASSWORD }}
          FTP_DIR: ${{ secrets.O2SWITCH_SERVER_DIR }}
        run: |
          lftp -c "
          set ftp:ssl-allow no;
          set net:timeout 30;
          open -u '$FTP_USER','$FTP_PASS' $FTP_HOST;
          mirror -R --only-newer --parallel=10 --verbose \
            --exclude-glob 'storage/*' \
            --exclude-glob 'vendor/*' \
            deploy/ $FTP_DIR;
          bye;"

      # Post-deploy hook
      - name: Auto post-deploy
        if: steps.check_o2switch.outputs.configured == 'true'
        env:
          HOOK_SECRET: ${{ secrets.DEPLOY_HOOK_SECRET }}
        run: |
          sleep 10
          curl -k -s --max-time 60 \
            "https://kenga.cdwfs.net/deploy-hook.php?secret=$HOOK_SECRET" || \
          echo "Deploy OK (hook optionnel)"

      - name: 🎉 SUCCESS
        if: steps.check_o2switch.outputs.configured == 'true'
        run: |
          echo "✅ LIVE: https://ngassam.cdwfs.net"
